[project]
name = "lol-assets-api"
version = "0.0.0"
description = "API que serve o índice, metadados e zips sob demanda."
requires-python = ">=3.12"
dependencies = [
    "lol-assets-schema",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lol_assets_api"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --all-packages --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Formatação
        run: uv run ruff format --check .

      - name: Tipos
        run: uv run mypy

      - name: Testes
        run: uv run pytest

  web:
    name: Web (eslint, tsc, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Tipos
        run: pnpm -r --if-present typecheck

      - name: Testes
        run: pnpm -r --if-present test

      # O que a Vercel roda (ADR 0016). O e2e sobe `next dev`; sem este passo, um
      # erro que só o build de produção pega chegaria ao deploy sem ninguém ver.
      - name: Build de produção
        run: pnpm --filter @lol-assets/web build

      # E o que o build publica — cabeçalhos da §9, noindex, os dois avisos —,
      # servido pelo servidor de produção do Next. É o mesmo script que o dono
      # roda contra a URL da Vercel.
      - name: Conferir o que o build publica
        working-directory: apps/web
        run: |
          pnpm exec next start --port 3100 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done
          node scripts/conferir-publicacao.mjs http://127.0.0.1:3100

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    # O fluxo inteiro sobe dois servidores e roda 13 cenários em ~20 s local.
    # O teto é folgado para timeout significar "travou", não "o runner estava lento".
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Só o Chromium: o e2e prova comportamento e o caminho do canvas do
      # ADR 0001, não compatibilidade entre motores. Três navegadores custariam
      # três vezes o download para provar a mesma coisa.
      - name: Instalar o Chromium do Playwright
        run: pnpm --filter @lol-assets/web exec playwright install --with-deps chromium

      - name: Fluxo completo
        run: pnpm --filter @lol-assets/web exec playwright test

      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}
          path: apps/web/playwright-report/
          retention-days: 7

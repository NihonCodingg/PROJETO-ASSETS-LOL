[project]
name = "lol-assets-schema"
version = "0.0.0"
description = "Contrato do índice de assets: JSON Schema, modelos Pydantic e tipos TypeScript."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lol_assets_schema"]
